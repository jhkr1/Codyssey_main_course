{% extends "base.html" %}

{% block content %}
<div class="flex-between" style="margin-bottom: 1.5rem;">
    <h2>메모 목록</h2>
    <a href="/memos/create" class="btn btn-primary">새 메모 작성</a>
</div>

<div class="container" style="padding: 1.5rem;">
    {% if memos %}
        <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 1rem;">
            {% for memo in memos %}
            <li style="border: 1px solid var(--border-color); border-radius: 8px; padding: 1.25rem; display: flex; justify-content: space-between; align-items: center; transition: var(--transition);" onmouseover="this.style.borderColor='var(--primary)'; this.style.boxShadow='0 2px 4px rgba(79, 70, 229, 0.1)'" onmouseout="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none'">
                <div>
                    <h3 style="margin: 0 0 0.5rem 0; font-size: 1.2rem;">{{ memo.title }}</h3>
                    <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">
                        {{ memo.content | truncate(50) }}
                    </p>
                </div>
                <a href="/memos/{{ memo.id }}" class="btn btn-outline" style="padding: 0.5rem 1rem;">상세보기</a>
            </li>
            {% endfor %}
        </ul>
    {% else %}
        <div style="text-align: center; padding: 3rem 0; color: var(--text-muted);">
            <p style="font-size: 1.1rem; margin-bottom: 1.5rem;">아직 등록된 메모가 없습니다.</p>
            <a href="/memos/create" class="btn btn-primary">첫 번째 메모 작성하기</a>
        </div>
    {% endif %}
</div>
{% endblock %}
