{% extends "base.html" %}

{% block content %}
<div class="container" style="text-align: center; padding: 4rem 2rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--primary);">나의 메모 앱</h1>
    <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 3rem;">
        일상의 아이디어와 할 일을 기록하고 관리하세요.<br>
        메모를 등록하고, 목록을 확인하고, 상세 내용을 수정/삭제할 수 있습니다.
    </p>
    
    <div class="flex-gap" style="justify-content: center;">
        <a href="/memos" class="btn btn-outline" style="font-size: 1.1rem; padding: 1rem 2rem;">목록 보기</a>
        <a href="/memos/create" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 2rem;">새 메모 작성</a>
    </div>
</div>
{% endblock %}
