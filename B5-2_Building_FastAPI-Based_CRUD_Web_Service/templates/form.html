{% extends "base.html" %}

{% block content %}
<div class="flex-between" style="margin-bottom: 1.5rem;">
    <h2>{% if memo %}메모 수정{% else %}새 메모 작성{% endif %}</h2>
</div>

<div class="container">
    <form action="{% if memo %}/memos/{{ memo.id }}/edit{% else %}/memos/create{% endif %}" method="POST">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" value="{% if memo %}{{ memo.title }}{% endif %}" required placeholder="메모 제목을 입력하세요">
        </div>
        
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="8" required placeholder="메모 내용을 자유롭게 적어보세요">{% if memo %}{{ memo.content }}{% endif %}</textarea>
        </div>
        
        <div class="flex-between" style="margin-top: 1rem;">
            <a href="{% if memo %}/memos/{{ memo.id }}{% else %}/memos{% endif %}" class="btn btn-outline">취소</a>
            <button type="submit" class="btn btn-primary">저장하기</button>
        </div>
    </form>
</div>
{% endblock %}
