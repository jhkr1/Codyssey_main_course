<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Task Manager{% endblock %}</title>
    <style>
        body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font-family: Arial, sans-serif; line-height: 1.5; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 1rem; margin-bottom: 2rem; }
        a { color: #2563eb; text-decoration: none; }
        nav, .actions { display: flex; align-items: center; gap: 0.75rem; }
        form { margin: 1rem 0; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; }
        button, .button { display: inline-block; padding: 0.5rem 0.8rem; border: 1px solid #2563eb; background: #2563eb; color: white; cursor: pointer; }
        .secondary { background: white; color: #2563eb; }
        .danger { background: #b91c1c; border-color: #b91c1c; }
        .error { color: #b91c1c; }
        .task { border: 1px solid #ddd; padding: 1rem; margin: 0.75rem 0; }
        .inline-form { display: inline; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <header>
        <a href="/"><strong>Project Task Manager</strong></a>
        <nav>
            {% if current_user %}
                <span>{{ current_user.username }}님, 환영합니다.</span>
                <a href="/projects">프로젝트</a>
                <form class="inline-form" action="/logout" method="post">
                    <button type="submit" class="secondary">로그아웃</button>
                </form>
            {% else %}
                <a class="button" href="/login">로그인</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
